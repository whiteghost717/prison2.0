name: Build PrisonRealm

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build PrisonRealm
        shell: bash
        run: |
          set -e

          echo "Checking repository folders..."
          ls -la

          if [ -f "PrisonRealm-2.0.0-Source/build.gradle" ]; then
            cd "PrisonRealm-2.0.0-Source"
          elif [ -f "PrisonRealm-2.0.0-Source/PrisonRealm/build.gradle" ]; then
            cd "PrisonRealm-2.0.0-Source/PrisonRealm"
          elif [ -f "PrisonRealm/build.gradle" ]; then
            cd "PrisonRealm"
          elif [ -f "build.gradle" ]; then
            echo "Building from repository root"
          else
            echo "ERROR: build.gradle not found!"
            find . -maxdepth 6 -type f -name "build.gradle" -print
            exit 1
          fi

          echo "Build directory: $PWD"
          gradle build --stacktrace

      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: PrisonRealm-JAR
          path: |
            PrisonRealm-2.0.0-Source/**/build/libs/*.jar
            PrisonRealm/build/libs/*.jar
            build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
