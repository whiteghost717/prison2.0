name: Build PrisonRealm

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Show repository files
        run: |
          echo "Repository contents:"
          ls -la
          if [ -f "PrisonRealm/build.gradle" ]; then
            cd PrisonRealm
          elif [ -f "build.gradle" ]; then
            cd .
          else
            echo "ERROR: build.gradle was not found in repository root or PrisonRealm/"
            find . -maxdepth 5 -type f \\( -name build.gradle -o -name settings.gradle \\)
            exit 1
          fi
          echo "Building from: $(pwd)"
          gradle build --stacktrace

      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: PrisonRealm-JAR
          path: |
            PrisonRealm/build/libs/*.jar
            build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
